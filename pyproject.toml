[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-proof-mcp"
version = "0.1.0"
description = "MCP server giving a coding agent a proof kernel, an axiom audit, and an honest 'I could not check that'"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["mcp", "lean", "formal-methods", "verification", "agents", "proof"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []          # the MCP transport is JSON-RPC over stdio; no SDK needed

[project.optional-dependencies]
# NOTE: `evidence` and `gridlock` on PyPI are UNRELATED third-party projects. Our
# distributions are `evidence-runner` and `gridlock-certify` (the import names are
# unchanged). Naming the bare forms here would pull a stranger's package in as a
# dependency of ours, where nobody would think to look for it.
#
# `siblings` and `portfolio` named signoff-cert, kvleak, preregister, floorgen and
# gatecount. None of those is on PyPI, so every one of those extras exited 1 on a
# resolver error. An extra that cannot resolve is an install command we shipped
# knowing it would fail -- the exact shape this server exists to catch.
#
# `evidence-runner` is the portfolio distribution that is on PyPI, so it is the one
# an extra can honestly promise. The rest install from a pinned git tag; the README's
# "Delegating tools" section lists the commands. Every delegating tool reports
# `unavailable` when its package is absent -- never a pass -- so the server is fully
# honest with none of them installed.
portfolio = ["evidence-runner"]
all = ["evidence-runner"]
dev = ["pytest>=7"]

[project.scripts]
formal-proof-mcp = "formal_proof_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.cold_install]
smoke = ["--selftest"]
